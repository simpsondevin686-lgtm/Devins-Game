<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devins Game — Planet</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:8px;left:10px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.85}
  #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;opacity:.5;pointer-events:none}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer;user-select:none;backdrop-filter:blur(2px)}
  #overlay small{font-size:13px;opacity:.7;font-weight:400}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud"></div>
<div id="crosshair"></div>
<div id="overlay">
  <div>Click to explore</div>
  <small>WASD move · Shift run · Space jump · Esc release</small>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
